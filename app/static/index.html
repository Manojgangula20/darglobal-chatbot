<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal &amp; Wasalt Assistant</title>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#14212b;--muted:#5d6b75;--line:#d5dcdb;--accent:#0f6b5c;--accent-ink:#fff;--user:#14212b;--user-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1719;--panel:#172326;--ink:#e6eeee;--muted:#93a4a8;--line:#27393d;--accent:#4fc4ae;--accent-ink:#07211c;--user:#4fc4ae;--user-ink:#07211c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{padding:22px 0 14px}
h1{margin:0;font:600 1.6rem/1.2 "Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.92rem}
#log{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:11px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px;white-space:normal}
.me{background:var(--user);color:var(--user-ink);align-self:flex-end;border-top-right-radius:4px}
.msg p{margin:0 0 .5em}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:.3em 0 .5em;padding-left:1.3em}
.msg li{margin:.15em 0}
.src{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);white-space:normal}
.src a{color:var(--accent);display:block;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.chip{font:inherit;font-size:.9rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
form{display:flex;gap:10px;padding:10px 0 8px}
input{flex:1;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.send{font:inherit;font-weight:600;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{padding:0 0 14px;color:var(--muted);font-size:.8rem}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.6}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>DarGlobal &amp; Wasalt Assistant</h1>
    <p class="sub">Ask about the companies, their projects and services. Answers come from their public websites.</p>
  </header>
  <div id="log" aria-live="polite">
    <div class="msg bot">Hello. What would you like to know about DarGlobal or Wasalt?</div>
    <div class="chips" id="chips"></div>
  </div>
  <form id="f">
    <input id="q" placeholder="Ask a question" autocomplete="off" maxlength="1000" aria-label="Your question">
    <button class="send" id="go">Send</button>
  </form>
  <footer id="fresh">Checking data freshness…</footer>
</div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
const history=[];
const ideas=["What does DarGlobal do?","What is Wasalt?","What projects does DarGlobal have in Oman?","What perks come with owning an AIDA residence?"];
const chips=document.getElementById('chips');
ideas.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>ask(t);chips.appendChild(b)});

function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}

// Minimal markdown -> DOM (bold, bullets, numbered lists). Builds nodes, never injects HTML.
function md(text){
  const frag=document.createDocumentFragment();
  let list=null,kind=null;
  const inline=(el,s)=>s.split(/(\*\*[^*]+\*\*)/g).forEach(p=>{
    if(p.length>4&&p.startsWith('**')&&p.endsWith('**')){
      const b=document.createElement('strong');b.textContent=p.slice(2,-2);el.appendChild(b);
    }else if(p){el.appendChild(document.createTextNode(p))}
  });
  text.split('\n').forEach(line=>{
    if(!line.trim())return;
    const ul=line.match(/^\s*[-*•]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),m=ul||ol;
    if(m){
      const want=ul?'UL':'OL';
      if(!list||kind!==want){list=document.createElement(want);kind=want;frag.appendChild(list)}
      const li=document.createElement('li');inline(li,m[1]);list.appendChild(li);
    }else{
      list=null;kind=null;
      const p=document.createElement('p');inline(p,line.replace(/^#+\s*/,'').trim());frag.appendChild(p);
    }
  });
  return frag;
}

async function ask(text){
  text=text.trim();if(!text)return;
  chips.remove();q.value='';go.disabled=true;
  add('me',text);
  const wait=add('bot','');wait.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-6)})});
    if(r.status===429){wait.textContent='You are sending questions a little too fast. Please wait a few seconds and try again.';go.disabled=false;q.focus();return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    wait.textContent='';
    wait.appendChild(md(d.answer));
    if(d.sources&&d.sources.length){
      const s=document.createElement('div');s.className='src';s.append('Sources');
      d.sources.forEach(x=>{const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.title;s.appendChild(a)});
      wait.appendChild(s);
    }
    history.push({role:'user',content:text},{role:'assistant',content:d.answer});
  }catch(e){wait.textContent='Something went wrong while reaching the server. Please try again.'}
  go.disabled=false;q.focus();log.scrollTop=log.scrollHeight;
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask(q.value)};

fetch('/status').then(r=>r.json()).then(s=>{
  const t=s.last_checked?new Date(s.last_checked).toLocaleString():'not yet';
  const m=s.refresh_interval_min;
  const every=m>=1440?'daily':m>=60?'every '+Math.round(m/60)+' hours':'every '+m+' minutes';
  document.getElementById('fresh').textContent='Data last checked: '+t+' · refreshed automatically '+every;
}).catch(()=>{document.getElementById('fresh').textContent=''});
</script>
</body>
</html>
