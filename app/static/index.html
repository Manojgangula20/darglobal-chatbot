<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f2eb">
<title>DarGlobal & Wasalt Assistant</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23283e35'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='65' fill='%23d7bd8e'%3ED%3C/text%3E%3C/svg%3E">

<style>
:root {
  --bg:#f5f2eb;
  --panel:#fffefa;
  --panel-soft:#f0ede5;
  --ink:#26332d;
  --muted:#7a8078;
  --line:#e4dfd4;
  --accent:#b49460;
  --accent-dark:#927142;
  --green:#283e35;
  --green-hover:#385347;
  --user:#283e35;
  --user-ink:#fff;
  --ok:#38966a;
  --shadow:0 12px 40px rgba(39,51,43,.055);
}

@media(prefers-color-scheme:dark) {
  :root {
    --bg:#121a17;
    --panel:#1c2823;
    --panel-soft:#25332d;
    --ink:#e9eee9;
    --muted:#a2ada4;
    --line:#34443b;
    --accent:#d1b47e;
    --accent-dark:#d1b47e;
    --green:#b5cbb9;
    --green-hover:#d2e1d4;
    --user:#b5cbb9;
    --user-ink:#17231c;
    --ok:#65c995;
    --shadow:0 12px 40px rgba(0,0,0,.15);
  }
}

*{box-sizing:border-box}

html,body{height:100%;margin:0}

body {
  background:
    radial-gradient(ellipse at 5% 0%,rgba(194,174,137,.15),transparent 35%),
    radial-gradient(ellipse at 100% 100%,rgba(125,153,133,.10),transparent 35%),
    var(--bg);
  color:var(--ink);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}

button,input{font:inherit}

.app {
  width:100%;
  max-width:950px;
  height:100%;
  height:100dvh;
  min-height:480px;
  display:flex;
  flex-direction:column;
  padding:0 30px;
}

/* HEADER */

header {
  min-height:85px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line);
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark {
  width:43px;
  height:43px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--green);
  color:#d7bd8e;
  box-shadow:0 5px 16px rgba(40,62,53,.14);
}

.brand-name {
  font:600 18px Georgia,serif;
  letter-spacing:.025em;
}

.brand-tag {
  color:var(--muted);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-top:3px;
}

.header-right {
  display:flex;
  align-items:center;
  gap:10px;
}

.ghost {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--ink);
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}

.ghost:hover {
  border-color:var(--accent);
  transform:translateY(-1px);
}

#log {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-anchor:none;
  padding:24px 2px;
  display:flex;
  flex-direction:column;
  gap:15px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
}

/* WELCOME */

.welcome {
  width:100%;
  max-width:760px;
  margin:auto;
  padding:25px 0 32px;
  animation:rise .55s ease both;
}

.eyebrow {
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--accent-dark);
  font-size:10px;
  letter-spacing:.2em;
  font-weight:700;
  text-transform:uppercase;
}

.eyebrow:before {
  content:"";
  width:25px;
  height:1px;
  background:var(--accent);
}

.welcome h2 {
  margin:18px 0 14px;
  font:400 clamp(36px,5vw,55px)/1.1 Georgia,serif;
  letter-spacing:-.035em;
}

.welcome h2 em {
  color:var(--accent-dark);
  font-weight:400;
}

.welcome-copy {
  max-width:580px;
  color:var(--muted);
  font-size:14px;
  line-height:1.85;
}

.welcome-rule {
  height:1px;
  margin:29px 0 22px;
  background:linear-gradient(90deg,var(--line),transparent);
}

.suggest-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.suggest-title {
  font-size:11px;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
}

.suggest-note {
  font-size:11px;
  color:var(--muted);
}

.chips {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.chip {
  display:flex;
  align-items:center;
  gap:12px;
  min-height:65px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}

.chip:hover {
  transform:translateY(-2px);
  border-color:var(--accent);
  box-shadow:var(--shadow);
}

.chip-icon {
  width:35px;
  height:35px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--panel-soft);
  color:var(--accent-dark);
}

.chip-text {
  font-size:12px;
  font-weight:550;
  line-height:1.5;
}

.chip-arrow {
  margin-left:auto;
  color:var(--muted);
}

/* CHAT */

.msg-row {
  display:flex;
  align-items:flex-end;
  gap:9px;
  max-width:88%;
  animation:messageIn .25s ease both;
}

.msg-row > div {
  min-width:0;
}

.bot-row{align-self:flex-start}
.me-row {
  align-self:flex-end;
  flex-direction:row-reverse;
}

.avatar {
  width:29px;
  height:29px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--green);
  color:#d7bd8e;
}

.me-row .avatar {
  background:var(--panel-soft);
  color:var(--muted);
}

.msg {
  padding:12px 15px;
  border-radius:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  min-width:0;
}

.bot {
  background:var(--panel);
  border:1px solid var(--line);
  border-top-left-radius:4px;
  box-shadow:0 3px 12px rgba(0,0,0,.025);
  white-space:normal;
}

.me {
  background:var(--user);
  color:var(--user-ink);
  border-top-right-radius:4px;
}

.msg p{margin:0 0 .6em}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:.3em 0 .6em;padding-left:1.3em}
.msg li{margin:.2em 0}
.msg strong{font-weight:700}

.src {
  margin-top:11px;
  padding-top:10px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--muted);
  max-width:100%;
  min-width:0;
}

.src-label {
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin-bottom:6px;
}

.src a {
  display:block;
  padding:3px 0;
  color:var(--accent-dark);
  text-decoration:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:100%;
  min-width:0;
}

.src a:hover{text-decoration:underline}

/* TYPING */

.typing {
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

.dots {
  display:inline-flex;
  gap:4px;
}

.dots span {
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1.1s infinite;
}

.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}

/* INPUT */

.composer {
  position:relative;
  z-index:2;
  background:var(--bg);
  flex:none;
  padding-top:13px;
  border-top:1px solid var(--line);
}

form {
  display:flex;
  gap:9px;
  padding-bottom:9px;
}

.input-wrap {
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  transition:.2s;
}

.input-wrap:focus-within {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(177,148,96,.18);
}

.input-icon{color:var(--muted);flex:none}

input {
  width:100%;
  min-width:0;
  padding:13px 0;
  border:0;
  outline:none;
  background:transparent;
  color:var(--ink);
  font-size:13px;
}

input:focus-visible {
  outline:none;
}

input::placeholder{color:var(--muted)}

button.send {
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  cursor:pointer;
  transition:.2s;
}

button.send:hover:not(:disabled) {
  transform:translateY(-2px);
  background:var(--green-hover);
}

button:disabled{opacity:.45;cursor:default}

.composer-foot {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:0 2px 10px;
  color:var(--muted);
  font-size:10px;
}

/* ORIGINAL DATA FRESHNESS FOOTER */

footer {
  position:relative;
  z-index:2;
  background:var(--bg);
  flex:none;
  padding:11px 0 14px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:39px;
}

.dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--line);
  flex:none;
}

.dot.ok {
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(46,158,107,.12);
}

.retry{margin-top:8px}

/* ACCESSIBILITY AND ANIMATIONS */

button:focus-visible,
a:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:3px;
}

@keyframes pulse {
  0%,80%,100%{opacity:.25;transform:translateY(0)}
  40%{opacity:1;transform:translateY(-3px)}
}

@keyframes rise {
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes messageIn {
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #log{scroll-behavior:auto}
}

@media(max-width:650px) {
  .app{padding:0 17px}
  header{min-height:74px}
  .brand-mark{width:37px;height:37px}
  .brand-name{font-size:15px}
  .brand-tag{font-size:9px;letter-spacing:.08em}
  .welcome{padding:18px 0 25px}
  .welcome h2{font-size:39px}
  .chips{grid-template-columns:1fr}
  .chip{min-height:57px}
  .msg-row{max-width:96%}
  .suggest-note{display:none}
}

@media(max-width:390px) {
  .app{padding:0 12px}
  .brand-name{font-size:14px}
  .ghost{padding:7px 8px;font-size:11px}
  .welcome h2{font-size:34px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 19V5h5c5.5 0 9 2.5 9 7s-3.5 7-9 7H5Z" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">DarGlobal & Wasalt</div>
      <div class="brand-tag">Property & Real Estate Assistant</div>
    </div>
  </div>

  <button class="ghost" id="reset" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
    New chat
  </button>
</header>

<div id="log" aria-live="polite" aria-label="Chat conversation"></div>

<div class="composer">
  <form id="f" autocomplete="off">
    <div class="input-wrap">
      <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>
      <input id="q" placeholder="Ask about DarGlobal or Wasalt…" maxlength="1000" aria-label="Your question">
    </div>

    <button class="send" id="go" type="submit" disabled aria-label="Send message">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </svg>
    </button>
  </form>

  <div class="composer-foot">
    <span>Explore DarGlobal developments and Wasalt services</span>
    <span>AI-powered assistant</span>
  </div>
</div>

<footer>
  <span class="dot" id="dot"></span>
  <span id="fresh">Checking data freshness…</span>
</footer>

</div>

<script>
const log=document.getElementById('log');
const q=document.getElementById('q');
const go=document.getElementById('go');

const ideas=[
  {icon:'building',label:'What does DarGlobal do?'},
  {icon:'globe',label:'What is Wasalt?'},
  {icon:'landmark',label:'What projects does DarGlobal have in Oman?'},
  {icon:'key',label:'What perks come with owning an AIDA residence?'}
];

let convo=[];
let busy=false;

const icons={
  building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4M8 7h2m4 0h2M8 11h2m4 0h2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  landmark:'<path d="m3 9 9-6 9 6M5 10h14M6 10v9m4-9v9m4-9v9m4-9v9M4 21h16"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-4 4 3 3m-6-1 3 3"/>',
  arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
  bot:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>'
};

function svg(name,size=16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.bot}</svg>`;
}

function add(cls,text) {
  const row=document.createElement('div');
  row.className='msg-row '+(cls==='me'?'me-row':'bot-row');

  const avatar=document.createElement('div');
  avatar.className='avatar';
  avatar.innerHTML=svg(cls==='me'?'user':'bot',15);

  const bubble=document.createElement('div');
  bubble.className='msg '+cls;
  bubble.textContent=text;

  row.append(avatar,bubble);
  log.appendChild(row);
  log.scrollTop=log.scrollHeight;

  return bubble;
}

// Safe markdown renderer: bold, bullets and numbered lists.
function md(text) {
  const frag=document.createDocumentFragment();
  let list=null,kind=null;

  const inline=(el,s)=>s.split(/(\*\*[^*]+\*\*)/g).forEach(p=>{
    if(p.length>4&&p.startsWith('**')&&p.endsWith('**')) {
      const b=document.createElement('strong');
      b.textContent=p.slice(2,-2);
      el.appendChild(b);
    } else if(p) {
      el.appendChild(document.createTextNode(p));
    }
  });

  text.split('\n').forEach(line=>{
    if(!line.trim())return;

    const ul=line.match(/^\s*[-*•]\s+(.*)/);
    const ol=line.match(/^\s*\d+[.)]\s+(.*)/);
    const m=ul||ol;

    if(m) {
      const want=ul?'UL':'OL';

      if(!list||kind!==want) {
        list=document.createElement(want);
        kind=want;
        frag.appendChild(list);
      }

      const li=document.createElement('li');
      inline(li,m[1]);
      list.appendChild(li);
    } else {
      list=null;
      kind=null;
      const p=document.createElement('p');
      inline(p,line.replace(/^#+\s*/,'').trim());
      frag.appendChild(p);
    }
  });

  return frag;
}

function normalizeSourceKey(rawUrl, rawTitle) {
  const u=new URL(rawUrl,location.origin);
  if(!['http:','https:'].includes(u.protocol))return null;
  u.hash='';
  const cleanPath=u.pathname.replace(/\/+$/,'')||'/';
  const normUrl=`${u.origin}${cleanPath}${u.search}`.toLowerCase();
  const normTitle=String(rawTitle||'').trim().toLowerCase();
  return `${normUrl}::${normTitle}`;
}

function renderBot(el,d) {
  el.textContent='';
  el.appendChild(md(String(d.answer||'I could not find an answer to that question.')));

  if(Array.isArray(d.sources)&&d.sources.length) {
    const s=document.createElement('div');
    s.className='src';

    const label=document.createElement('div');
    label.className='src-label';
    label.textContent='Sources';
    s.appendChild(label);

    const seen=new Set();
    let count=0;

    d.sources.forEach(x=>{
      if(!x||typeof x.url!=='string')return;

      try {
        const u=new URL(x.url,location.origin);
        const titleText=String(x.title||u.hostname).trim();
        const key=normalizeSourceKey(x.url,titleText);
        if(!key||seen.has(key))return;
        seen.add(key);

        const a=document.createElement('a');
        a.href=u.href;
        a.target='_blank';
        a.rel='noopener noreferrer';
        a.textContent=titleText;
        s.appendChild(a);
        count++;
      } catch(_) {}
    });

    if(count>0)el.appendChild(s);
  }
}

// WELCOME SCREEN

function start() {
  log.textContent='';
  convo=[];

  const w=document.createElement('section');
  w.className='welcome';

  w.innerHTML=`
    <div class="eyebrow">Your DarGlobal & Wasalt guide</div>

    <h2>Discover a world of<br><em>exceptional possibilities.</em></h2>

    <p class="welcome-copy">
      Welcome. I'm your DarGlobal & Wasalt assistant,
      here to help you explore DarGlobal's luxury real estate
      developments and Wasalt's property platform, services
      and offerings. What would you like to discover?
    </p>

    <div class="welcome-rule"></div>

    <div class="suggest-head">
      <span class="suggest-title">Start a conversation</span>
      <span class="suggest-note">Explore both brands or ask anything</span>
    </div>
  `;

  const chips=document.createElement('div');
  chips.className='chips';

  ideas.forEach(item=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='chip';

    b.innerHTML=`
      <span class="chip-icon">${svg(item.icon,17)}</span>
      <span class="chip-text"></span>
      <span class="chip-arrow">${svg('arrow',15)}</span>
    `;

    b.querySelector('.chip-text').textContent=item.label;
    b.addEventListener('click',()=>ask(item.label));
    chips.appendChild(b);
  });

  w.appendChild(chips);
  log.appendChild(w);
}

function setBusy(v) {
  busy=v;
  go.disabled=v||!q.value.trim();
  q.disabled=v;
}

// CHAT REQUEST

async function ask(text) {
  text=text.trim();
  if(!text||busy)return;

  const welcome=log.querySelector('.welcome');
  if(welcome)welcome.remove();

  q.value='';
  setBusy(true);

  add('me',text);

  const wait=add('bot','');

  wait.innerHTML=`
    <div class="typing">
      <span class="dots"><span></span><span></span><span></span></span>
      <span class="typing-text">Searching the data…</span>
    </div>
  `;

  const ctl=new AbortController();
  const kill=setTimeout(()=>ctl.abort(),90000);

  const slow=setTimeout(()=>{
    const status=wait.querySelector('.typing-text');
    if(status)status.textContent='Still working on your answer…';
  },12000);

  try {
    const r=await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal:ctl.signal,
      body:JSON.stringify({
        message:text,
        history:convo.slice(-6)
      })
    });

    if(r.status===429) {
      fail(wait,text,'You are sending questions a little too fast. Please wait a few seconds and try again.');
    } else if(!r.ok) {
      throw new Error('HTTP '+r.status);
    } else {
      const d=await r.json();
      renderBot(wait,d);

      convo.push(
        {role:'user',content:text},
        {role:'assistant',content:String(d.answer||'')}
      );
    }

  } catch(e) {
    fail(
      wait,
      text,
      e.name==='AbortError'
        ?'This is taking too long. Please try again.'
        :'Something went wrong while reaching the server.'
    );
  } finally {
    clearTimeout(slow);
    clearTimeout(kill);
    setBusy(false);
    q.focus({preventScroll:true});
    requestAnimationFrame(()=>{
      log.scrollTop=log.scrollHeight;
    });
  }
}

function fail(el,text,msg) {
  el.textContent=msg+' ';

  const b=document.createElement('button');
  b.type='button';
  b.className='ghost retry';
  b.textContent='Try again';

  b.onclick=()=>{
    const row=el.closest('.msg-row');
    const prev=row&&row.previousElementSibling;

    if(prev&&prev.classList.contains('me-row'))prev.remove();
    if(row)row.remove();

    ask(text);
  };

  el.appendChild(document.createElement('br'));
  el.appendChild(b);
}

// FORM EVENTS

document.getElementById('f').onsubmit=e=>{
  e.preventDefault();
  ask(q.value);
};

q.addEventListener('input',()=>{
  go.disabled=busy||!q.value.trim();
});

document.getElementById('reset').onclick=()=>{
  if(!busy) {
    start();
    q.focus();
  }
};

// ORIGINAL DATA FRESHNESS LOGIC

function ago(iso) {
  const date=new Date(iso);
  if(Number.isNaN(date.getTime()))return '';

  const m=Math.max(0,Math.round((Date.now()-date.getTime())/60000));

  if(m<1)return 'just now';
  if(m<60)return m+' min ago';

  const h=Math.round(m/60);
  return h<48?h+' h ago':Math.round(h/24)+' days ago';
}

function loadStatus() {
  fetch('/status')
    .then(r=>{
      if(!r.ok)throw new Error('Status unavailable');
      return r.json();
    })
    .then(s=>{
      const mins=Number(s.refresh_interval_min);
      const every=mins>=1440
        ?'daily'
        :mins>=60
          ?'every '+Math.round(mins/60)+' h'
          :'every '+mins+' min';

      document.getElementById('fresh').textContent=
        (s.last_checked
          ?'Data checked '+ago(s.last_checked)
          :'Data not checked yet')
        +' · auto-refresh '+every;

      document.getElementById('dot').className='dot ok';
    })
    .catch(()=>{
      document.getElementById('fresh').textContent='';
      document.getElementById('dot').className='dot';
    });
}

// WAKE THE BACKEND WHEN THE VISITOR OPENS THE CHATBOT

async function wakeServer() {
  try {
    await fetch('/health',{
      method:'GET',
      cache:'no-store'
    });
  } catch(e) {
    // Chat can still proceed when the user sends a question.
  }
}

// INITIALIZE ONCE

start();
wakeServer();
loadStatus();
setInterval(loadStatus,5*60*1000);

</script>
